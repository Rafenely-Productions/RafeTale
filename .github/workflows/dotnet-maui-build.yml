name: .NET 10 MAUI Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    name: Build & Test on Windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Run tests
        run: dotnet test tests/RafeTale.Tests/RafeTale.Tests.csproj --configuration Release --verbosity normal

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Build MAUI Windows
        run: dotnet build src/RafeTale.MAUI/RafeTale.MAUI.csproj --configuration Release -f net10.0-windows10.0.19041.0

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/bin/Release/
            **/obj/Release/
