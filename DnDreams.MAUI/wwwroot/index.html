<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>DnDreams</title>
    <base href="/" />

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="DnDreams.MAUI.styles.css" />

    <style>
        :root {
            --dnd-gold: #d4af37;
            --dnd-dark: #121212;
        }

        html, body {
            background-color: var(--dnd-dark) !important;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        #app {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--dnd-dark);
        }

        /* Contenedor principal de carga */
        .loading-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        /* Estilo del Logo con latido */
        .loading-logo {
            width: 120px;
            height: auto;
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.3));
            animation: pulse-logo 2.5s ease-in-out infinite;
        }

        /* El Dado como indicador secundario */
        .dice-icon {
            font-size: 2.5rem;
            color: var(--dnd-gold);
            animation: wobble 1s infinite ease-in-out;
            display: inline-block;
        }

        .loading-text-glow {
            color: var(--dnd-gold);
            font-family: 'Cinzel', serif;
            letter-spacing: 3px;
            font-size: 0.85rem;
            text-transform: uppercase;
            margin-top: 1rem;
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.6);
            opacity: 0.9;
        }

        /* Barra de progreso minimalista */
        .progress-bar-container {
            width: 200px;
            height: 2px;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        .progress-bar-fill {
            width: 40%;
            height: 100%;
            background: var(--dnd-gold);
            box-shadow: 0 0 10px var(--dnd-gold);
            animation: slide 1.8s infinite ease-in-out;
        }

        /* Keyframes */
        @keyframes pulse-logo {
            0%, 100% {
                transform: scale(1);
                opacity: 0.9;
            }

            50% {
                transform: scale(1.05);
                opacity: 1;
            }
        }

        @keyframes wobble {
            0%, 100% {
                transform: rotate(-15deg);
            }

            50% {
                transform: rotate(15deg);
            }
        }

        @keyframes slide {
            0% {
                transform: translateX(-110%);
            }

            100% {
                transform: translateX(110%);
            }
        }
    </style>
</head>

<body>
    <div class="status-bar-safe-area"></div>

    <div id="app">
        <div class="loading-wrapper">
            <img src="images/logo.svg" class="loading-logo" alt="Logo DnDreams" />

            <div class="text-center">
                <i class="bi bi-dice-6-fill dice-icon"></i>
                <div class="loading-text-glow">Lanzando iniciativa...</div>

                <div class="progress-bar-container">
                    <div class="progress-bar-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>
</html>
